name: validate

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install python-docx
      - name: Compile scripts
        run: python -m py_compile plugins/agent-plugin-digest/skills/agent-plugin-digest/scripts/*.py
      - name: Validate JSON files
        run: python tests/validate_json.py
      - name: History continuation smoke test
        run: python tests/test_history.py
